name: Create release
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false
on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'void-packages/srcpkgs/ungoogled-chromium/**'

jobs:
  Fetch:
    if: github.repository == 'KevinRunforrestt/ungoogled-chromium-void'
    runs-on: ubuntu-latest
    outputs:
      ver: ${{ steps.version.outputs.ver }}
      rev: ${{ steps.version.outputs.rev }}
      skip_ci: ${{ steps.ci_skip_check.outputs.skip_ci }}
    steps:
      - name: Check for [ci-skip] in commit message
        id: ci_skip_check
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          if echo "${COMMIT_MSG}" | grep -iqE '\[ci-skip\]|\[skip ci\]'; then
            echo "CI skip detected. Skipping further steps."
            echo "skip_ci=true" >> $GITHUB_OUTPUT
          else
            echo "skip_ci=false" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - name: Fetch this repository
        if: steps.ci_skip_check.outputs.skip_ci == 'false'
        uses: actions/checkout@v4
        with:
          path: master

      - name: Read version/revision
        if: steps.ci_skip_check.outputs.skip_ci == 'false'
        id: version
        run: |
          echo "ver=$( grep -m 1 'version='  master/void-packages/srcpkgs/ungoogled-chromium/template | awk -F '=' '{ print $2 }' )" >> $GITHUB_OUTPUT
          echo "rev=$( grep -m 1 'revision=' master/void-packages/srcpkgs/ungoogled-chromium/template | awk -F '=' '{ print $2 }' )" >> $GITHUB_OUTPUT

  Build:
    runs-on: ubuntu-22.04
    timeout-minutes: 1440
    container:
      image: ghcr.io/void-linux/void-musl:20260701r1
      options: --privileged
    steps:
      - name: Fix SSL and install tools
        run: |
          xbps-install -Syu --repository=https://repo-de.voidlinux.org/current/ xbps
          xbps-install -Suyd --repository=https://repo-de.voidlinux.org/current/
          xbps-install -y --repository=https://repo-de.voidlinux.org/current/ \
            base-chroot base-devel git curl ca-certificates \
            python3 bash sudo xtools openssl tar xz

          # Create the build user. xbps-src refuses to run as root, and the
          # setuid xbps-uchroot helper requires group 'xbuilder'.
          groupadd -f xbuilder
          useradd -m -s /bin/bash -G xbuilder builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/builder

      - name: Checkout this repository
        uses: actions/checkout@v4
        with:
          path: repo

      - name: Clone void-packages and overlay our template
        env:
          WS: ${{ github.workspace }}
        run: |
          git clone --depth 1 https://github.com/void-linux/void-packages.git /tmp/void-packages
          cd /tmp/void-packages
          # Replace the upstream ungoogled-chromium template with ours.
          rm -rf srcpkgs/ungoogled-chromium srcpkgs/ungoogled-chromium-qt6
          cp -r "${WS}/repo/void-packages/srcpkgs/ungoogled-chromium"    srcpkgs/
          cp -r "${WS}/repo/void-packages/srcpkgs/ungoogled-chromium-qt6" srcpkgs/
          echo "=== Template head (sanity check) ==="
          grep -E '^(version|revision|_rollup|_commit_id)=' srcpkgs/ungoogled-chromium/template

          chown -R builder:builder /tmp/void-packages

      - name: Build ungoogled-chromium (${{ matrix.description }})
        env:
          XBPS_PASSPHRASE: ${{ secrets.SUPERBIA }}
        run: |
          su - builder -c 'cd /tmp/void-packages && ./xbps-src binary-bootstrap'
          su - builder -c 'cd /tmp/void-packages && ./xbps-src pkg ungoogled-chromium'

          echo "=== Produced packages ==="
          ls -la /tmp/void-packages/hostdir/binpkgs/ungoogled-chromium* || true

      - name: Sign packages (optional — only if SHIRAORI_PEM is set)
        env:
          SHIRAORI_PEM: ${{ secrets.SHIRAORI_PEM }}
          XBPS_PASSPHRASE: ${{ secrets.SUPERBIA }}
        run: |
          if [ -z "${SHIRAORI_PEM}" ]; then
            echo "SHIRAORI_PEM secret is not set — skipping signing step."
            echo "Packages will still be released, just without .sig2 signatures."
            exit 0
          fi

          printf '%s\n' "${SHIRAORI_PEM}" > /tmp/shiraori.pem
          chmod 600 /tmp/shiraori.pem

          cd /tmp/void-packages/hostdir/binpkgs
          # xbps-rindex names the repodata file after the target arch.
          rm -f "${XBPS_TARGET_ARCH}-repodata"

          xbps-rindex -a "ungoogled-chromium-${PKG_VER}_${PKG_REV}.${XBPS_TARGET_ARCH}.xbps"
          xbps-rindex -a "ungoogled-chromium-qt6-${PKG_VER}_${PKG_REV}.${XBPS_TARGET_ARCH}.xbps"

          xbps-rindex --sign --signedby "Shiraori archive" \
            --privkey /tmp/shiraori.pem "$PWD"

          xbps-rindex --sign-pkg --privkey /tmp/shiraori.pem \
            "ungoogled-chromium-${PKG_VER}_${PKG_REV}.${XBPS_TARGET_ARCH}.xbps"
          xbps-rindex --sign-pkg --privkey /tmp/shiraori.pem \
            "ungoogled-chromium-qt6-${PKG_VER}_${PKG_REV}.${XBPS_TARGET_ARCH}.xbps"

          rm -f /tmp/shiraori.pem
          echo "=== Signed packages ==="
          ls -la ungoogled-chromium* "${XBPS_TARGET_ARCH}-repodata" 2>/dev/null || true

      - name: Upload binpkgs as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: binpkgs-${{ matrix.arch }}
          path: |
            /tmp/void-packages/hostdir/binpkgs/ungoogled-chromium-${{ needs.Fetch.outputs.ver }}_${{ needs.Fetch.outputs.rev }}.${{ matrix.arch }}.xbps
            /tmp/void-packages/hostdir/binpkgs/ungoogled-chromium-qt6-${{ needs.Fetch.outputs.ver }}_${{ needs.Fetch.outputs.rev }}.${{ matrix.arch }}.xbps
            /tmp/void-packages/hostdir/binpkgs/ungoogled-chromium-${{ needs.Fetch.outputs.ver }}_${{ needs.Fetch.outputs.rev }}.${{ matrix.arch }}.xbps.sig2
            /tmp/void-packages/hostdir/binpkgs/ungoogled-chromium-qt6-${{ needs.Fetch.outputs.ver }}_${{ needs.Fetch.outputs.rev }}.${{ matrix.arch }}.xbps.sig2
            /tmp/void-packages/hostdir/binpkgs/${{ matrix.arch }}-repodata
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0

  Release:
    needs: [Fetch, Build]
    if: needs.Fetch.outputs.skip_ci == 'false' && always() && needs.Build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Download all binpkgs artifacts
        uses: actions/download-artifact@v4
        with:
          path: binpkgs
          pattern: binpkgs-*
          merge-multiple: true

      - name: List downloaded artifacts
        run: |
          echo "=== Downloaded .xbps files ==="
          ls -la binpkgs/ || true

      - name: Create / update GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body: |
            Chromium release: <a href='https://chromium.googlesource.com/chromium/src/+/refs/tags/${{ needs.Fetch.outputs.ver }}'>${{ needs.Fetch.outputs.ver }}</a>
            Ungoogled Chromium release: <a href='https://github.com/ungoogled-software/ungoogled-chromium/releases/tag/${{ needs.Fetch.outputs.ver }}-${{ needs.Fetch.outputs.rev }}'>${{ needs.Fetch.outputs.ver }}-${{ needs.Fetch.outputs.rev }}</a>
          files: |
            binpkgs/ungoogled-chromium-${{ needs.Fetch.outputs.ver }}_${{ needs.Fetch.outputs.rev }}.x86_64.xbps
            binpkgs/ungoogled-chromium-qt6-${{ needs.Fetch.outputs.ver }}_${{ needs.Fetch.outputs.rev }}.x86_64.xbps
            binpkgs/ungoogled-chromium-${{ needs.Fetch.outputs.ver }}_${{ needs.Fetch.outputs.rev }}.x86_64.xbps.sig2
            binpkgs/ungoogled-chromium-qt6-${{ needs.Fetch.outputs.ver }}_${{ needs.Fetch.outputs.rev }}.x86_64.xbps.sig2
            binpkgs/x86_64-repodata
            binpkgs/ungoogled-chromium-${{ needs.Fetch.outputs.ver }}_${{ needs.Fetch.outputs.rev }}.x86_64-musl.xbps
            binpkgs/ungoogled-chromium-qt6-${{ needs.Fetch.outputs.ver }}_${{ needs.Fetch.outputs.rev }}.x86_64-musl.xbps
            binpkgs/ungoogled-chromium-${{ needs.Fetch.outputs.ver }}_${{ needs.Fetch.outputs.rev }}.x86_64-musl.xbps.sig2
            binpkgs/ungoogled-chromium-qt6-${{ needs.Fetch.outputs.ver }}_${{ needs.Fetch.outputs.rev }}.x86_64-musl.xbps.sig2
            binpkgs/x86_64-musl-repodata
          tag_name: ${{ needs.Fetch.outputs.ver }}_${{ needs.Fetch.outputs.rev }}
          fail_on_unmatched_files: false

  Cleanup:
    needs: [Release]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Cleanup old release files (keep 5 latest)
        uses: dev-drprasad/delete-older-releases@v0.3.3
        with:
          keep_latest: 5
          delete_tags: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
